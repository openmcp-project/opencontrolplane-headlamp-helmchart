name: Chart Tests

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  lint-and-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Add Headlamp helm repo
        run: helm repo add headlamp https://kubernetes-sigs.github.io/headlamp/

      - name: Build chart dependencies
        run: helm dependency update

      - name: Lint chart
        run: helm lint . --strict

      - name: Template chart (default values)
        run: helm template headlamp-test . | tee /tmp/rendered.yaml

      - name: Validate rendered YAML contains expected resources
        run: |
          # Deployment should be present
          grep -q "kind: Deployment" /tmp/rendered.yaml
          # pluginsManager config should be rendered
          grep -q "headlamp-ocp" /tmp/rendered.yaml
          grep -q "headlamp-crossplane" /tmp/rendered.yaml
          echo "All checks passed"
